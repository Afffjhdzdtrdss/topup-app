<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GameDoko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Cinzel:wght@700;900&family=Lilita+One&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--text:#121826;--muted:#667085;--line:#e4e7ee;--blue:#1d4ed8;--blue2:#2563eb;--gold:#f59e0b;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--grey:#e5e8ee;--accent:#ff5a1f}
[data-theme="dark"]{--bg:#0d1117;--card:#161b24;--text:#eef1f6;--muted:#98a2b3;--line:#262d3a;--grey:#232830}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}
input,textarea{font:inherit}
.hidden{display:none!important}

/* Splash */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#1e3a8a,#2563eb);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash .sticker{font-size:110px;animation:wave 1.6s ease-in-out infinite;transform-origin:70% 80%}
#splash h1{font-size:44px;margin:10px 0 4px;letter-spacing:1px}
#splash p{margin:0;opacity:.85}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* Login */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:linear-gradient(160deg,#1e3a8a,#2563eb);color:#fff;z-index:90;text-align:center}
.screen .sticker{font-size:80px}
.screen h2{margin:8px 0 6px;font-size:30px}
.screen p{margin:0 0 26px;opacity:.9}
.whitebtn{background:#fff;color:#111;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Top bar */
#topbar{position:fixed;top:0;left:0;right:0;height:58px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:50;padding-top:env(safe-area-inset-top)}
#topbar .left,#topbar .right{display:flex;align-items:center;gap:6px;min-width:96px}
#topbar .right{justify-content:flex-end}
#topbar .title{font-weight:800;font-size:20px;letter-spacing:.5px}
#topbar .title span{color:var(--gold)}
.ibtn{background:transparent;color:#fff;font-size:22px;width:42px;height:42px;border-radius:50%;position:relative}
.ibtn:active{background:#222}
.badge{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;font-size:11px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
#app{padding:70px 14px 150px;max-width:560px;margin:0 auto}
.page-title{font-size:20px;font-weight:800;margin:6px 0 12px;display:flex;align-items:center;gap:10px}
.back{background:var(--card);color:var(--text);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}

/* Bottom nav (like the reference) */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
#nav button{flex:1;background:transparent;color:#9aa3b2;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:16px;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase}
#nav button svg{width:26px;height:26px}
#nav button.active{color:var(--accent);background:rgba(255,90,31,.14)}
#fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:55;background:var(--accent);color:#fff;font-weight:800;border-radius:28px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;font-size:15px}
#fab .badge{top:-6px;right:-4px}

/* Store status */
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--grey);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.status .sleft{flex:1;min-width:0}
.sbar{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;letter-spacing:1.5px;padding:7px 16px;border-radius:8px;font-size:15px}
.sbar i{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block}
.sbar.open{background:#16a34a}
.sbar.closed{background:#dc2626}
.stext{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.4}
.sflag svg{height:62px;width:auto;display:block}

/* Home */
.games{display:grid;gap:10px}
.game{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:0;color:#fff;text-align:left;width:100%;overflow:hidden;min-height:84px;position:relative}
.game .em{font-size:44px;padding:0 6px 0 16px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.game .go{margin-left:auto;margin-right:16px;font-size:26px;opacity:.9}
.game small{display:block;opacity:.85;font-size:12px;margin-top:2px;font-family:system-ui,sans-serif;letter-spacing:0}
.off{background:#16a34a;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:4px;white-space:nowrap;font-family:system-ui,sans-serif;letter-spacing:0}
.gimg{width:64px;height:64px;border-radius:14px;object-fit:cover;margin-left:12px;flex-shrink:0;border:2px solid rgba(255,255,255,.4);background:#000}
.banner{border-radius:18px;padding:20px 16px;margin-bottom:6px;color:#fff;display:flex;align-items:center;gap:14px;min-height:96px}
.banner .em{font-size:52px}
.banner .gimg{width:78px;height:78px;margin:0}
.wm{display:block;line-height:1.05}
.wm-ff{font-family:'Bangers',cursive;font-size:30px;letter-spacing:2px;color:#ffb300;text-shadow:2px 2px 0 #b71c1c,0 0 12px rgba(255,120,0,.6);font-style:italic}
.wm-pubg{font-family:'Black Ops One',cursive;font-size:27px;letter-spacing:1px;color:#f4c430;text-shadow:2px 2px 0 #3b3a1e}
.wm-ml{font-family:'Cinzel',serif;font-weight:900;font-size:25px;letter-spacing:1px;color:#ffe08a;text-shadow:0 2px 0 #1e3a8a,0 0 10px rgba(80,140,255,.8)}
.wm-rb{font-family:'Lilita One',cursive;font-size:30px;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #9f1d1d,0 0 10px rgba(255,255,255,.35)}

/* Why choose */
.why h3{margin:0 0 6px;font-size:20px}
details.pl{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--bg)}
details.pl summary{padding:12px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.pl summary::after{content:"▾";color:var(--muted)}
details.pl[open] summary::after{content:"▴"}
details.pl .in{padding:0 14px 12px}
.pl h4{margin:10px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.pl .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pl .r:last-child{border:0}

/* Packages */
.sect{font-weight:800;margin:14px 2px 8px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px}
.pkg{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-align:left}
.pkg:active{border-color:var(--blue2)}
.pkg .l{display:flex;align-items:center;gap:12px}
.pkg .em{font-size:30px;width:44px;text-align:center}
.pkg .price{font-weight:800;color:var(--blue2);font-size:16px;white-space:nowrap}

/* Forms */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.inp{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.inp:focus{outline:0;border-color:var(--blue2)}
.ptitle{font-size:17px;font-weight:800;line-height:1.45;margin:14px 0 10px;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);text-align:center}
.ptitle span{display:block;font-size:16px;margin-top:4px;color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.btn{width:100%;background:var(--blue2);color:#fff;font-weight:800;padding:15px;border-radius:14px;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.6}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line);margin-top:10px}
.btn.red{background:var(--bad)}
.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum:last-child{border:0}
.qrbox{text-align:center}
.qrbox img{width:100%;max-width:300px;border-radius:14px;border:1px solid var(--line)}
.amt{font-size:30px;font-weight:900;color:var(--blue2);margin:6px 0}
.shot{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}

/* Orders / notifications / admin */
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.chip.pending{background:var(--warn)}.chip.approved{background:var(--ok)}.chip.rejected{background:var(--bad)}
.n-row{display:flex;gap:12px;align-items:flex-start}
.n-row .dot{font-size:26px}
.n-row b{display:block}
.thumb{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{margin-top:10px;padding:12px;flex:1;min-width:120px}
.ftabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.ftab{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;position:relative}
.ftab.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.crow{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;color:var(--text);text-align:left}
.crow .av{width:42px;height:42px;border-radius:50%;background:var(--blue2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.crow .tx{flex:1;min-width:0}
.crow .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotred{width:12px;height:12px;border-radius:50%;background:var(--bad);flex-shrink:0}

/* Chat */
.chatbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;height:calc(100vh - 290px);min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--blue2);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--grey);color:var(--text);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform .inp{flex:1}
.send{background:var(--accent);color:#fff;width:50px;border-radius:12px;font-size:20px}

/* Settings */
.set{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;background:transparent;color:var(--text);text-align:left;font-size:16px}
.set:last-child{border:0}
.switch{width:50px;height:28px;background:var(--line);border-radius:20px;position:relative;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:var(--blue2)}
.switch.on::after{left:25px}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:120;padding:24px}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center}
.modal .em{font-size:56px}
.modal h3{margin:6px 0}
.sheet{position:fixed;top:64px;right:10px;left:10px;max-width:340px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:70;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#toast{position:fixed;left:14px;right:14px;top:70px;background:#111;color:#fff;padding:14px;border-radius:14px;z-index:130;transform:translateY(-140px);transition:transform .35s;max-width:520px;margin:0 auto;font-size:14px}
#toast.show{transform:translateY(0)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:18px 0}
</style>
</head>
<body>

<div id="splash">
  <div class="sticker">🙏</div>
  <h1>Namaste</h1>
  <p>GameDoko</p>
</div>

<div id="loginScreen" class="screen hidden">
  <div class="sticker">🙏</div>
  <h2>Namaste! Welcome to GameDoko</h2>
  <p>Fast and trusted game top-up</p>
  <button class="whitebtn" id="googleBtn"><span style="font-size:20px">G</span> Continue with Google</button>

</div>

<div id="main" class="hidden">

    <button data-go="support"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>Support</button>

  </div>
</div>

<div id="profileSheet" class="sheet hidden"></div>
<div id="toast"></div>
<div id="modalHost"></div>

setTimeout(function(){
  if(window.__gd_ready) return;
  var sp=document.getElementById('splash'); if(sp) sp.remove();
  var ls=document.getElementById('loginScreen'); ls.classList.remove('hidden');
  var b=document.getElementById('googleBtn'); if(b) b.style.display='none';
  document.getElementById('loginErr').innerHTML='This file does not work when opened directly.<br>Please open the app from its Netlify link.';
},4000);
</script>

/* Listed prices are already the discounted prices. The old (struck) price is worked back from the discount %. */
function offOf(g, p){
  if (g.id === "pubg") return 0;                 // PUBG: no OFF tag
  if (p > 1000) return 4;                        // above Rs 1000: 4% OFF
  if (g.id === "ff" && p === 115) return 2;      // Free Fire 115 diamonds: 2% OFF
  if (p >= 400) return g.id === "ml" ? 3 : g.id === "ff" ? 2 : 0;  // Mobile Legends 3%, Free Fire 2%
  return 0;                                      // below Rs 400: no tag
}
const wasOf = (pct, p) => Math.round(p / (1 - pct/100));
const maxOff = g => Math.max(0, ...g.cats.flatMap(c => c.items.map(it => offOf(g, it[1]))));
function priceHTML(g, p){
  const pc = offOf(g, p);
  return pc > 0 ? `<s class="muted" style="font-weight:400;font-size:12px">${rs(wasOf(pc,p))}</s><br>${rs(p)} <span class="off">${pc}% OFF</span>` : rs(p);
}

/* ---------- Store hours (Nepal time) ---------- */
function nepalHour(){
  const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kathmandu",hour:"numeric",hour12:false}).formatToParts(new Date());
  return Number(parts.find(p=>p.type==="hour").value) % 24;
}
const storeOpen = () => { const h = nepalHour(); return h >= OPEN_HOUR && h < CLOSE_HOUR; };
function statusHTML(){
  const open = storeOpen();
  return `<div class="sleft">

}

onAuthStateChanged(auth, async user => {

function watchAll(){
  [unsubOrders, unsubAdmin, unsubChatDoc, unsubAdminChats].forEach(u => u && u());
  firstLoad = true;
  unsubOrders = onSnapshot(query(collection(db,"orders"), where("uid","==",me.uid)), snap => {
    if (!firstLoad) {
      snap.docChanges().forEach(ch => {
        if (ch.type === "modified") {
          const o = ch.doc.data();
          if (o.status === "approved") toast("✅ Your payment is successful and your top-up is done. Please visit again 🙏");
          if (o.status === "rejected") toast("❌ We could not verify your payment. Check notifications or contact support.");
        }
      });
    }
    firstLoad = false;
    myOrders = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>ts(b)-ts(a));
    updateBadge();
    if (current.page === "notifications") render();
  }, err => console.warn(err));

  unsubChatDoc = onSnapshot(doc(db,"chats",me.uid), snap => {
    unreadUser = !!(snap.exists() && snap.data().unreadUser);
    if (current.page === "chat" && unreadUser) markUserRead();
    updateFab();
  }, err => console.warn(err));

  if (isAdmin()) {
    unsubAdmin = onSnapshot(collection(db,"orders"), snap => {
      adminOrders = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>ts(b)-ts(a));
      if (current.page === "admin") render();
    });
    unsubAdminChats = onSnapshot(collection(db,"chats"), snap => {
      adminChats = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>chatTs(b)-chatTs(a));
      const n = adminChats.filter(c=>c.unreadAdmin).length;
      const g = $("#gearBadge"); g.textContent = n; g.classList.toggle("hidden", n===0);
      if (current.page === "admin" && adminView === "chats") render();
    });
  }
}

function go(page, extra={}, push=true){

    try {
      if (!historyInit) { history.replaceState({ page, extra }, ""); historyInit = true; }
      else history.pushState({ page, extra }, "");
    } catch(e){}
  }
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.go === page));
  $("#profileSheet").classList.add("hidden");
  render(); updateFab(); window.scrollTo(0,0);
}

async function uploadShot(file){
  const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method:"POST", body:fd });
  const j = await r.json();
  if (!j.secure_url) throw new Error((j.error && j.error.message) || "upload failed");
  return j.secure_url;
}

async function submitOrder(){
  const g = GAMES.find(x=>x.id===current.game), it = current.item;
  const total = it.price + SERVICE_CHARGE;
  const id1 = $("#gid").value.trim(), id2 = $("#gid2").value.trim(), err = $("#err");
  err.textContent = "";
  if (!g.rule.re.test(id1)) return err.textContent = g.rule.msg;
  if (id1 !== id2) return err.textContent = "The two IDs do not match. Please check again.";
  const gameId = id1;
  const sphone = $("#sphone").value.trim(), samt = $("#samt").value.trim(), stxn = $("#stxn").value.trim();
  const phoneOk = /^\d{9,10}$/.test(sphone), amtOk = Number(samt) > 0, txnOk = stxn.length >= 3;
  const detailsOk = phoneOk && amtOk && txnOk;
  if (!shotFile && !detailsOk) {
    if (!sphone && !samt && !stxn) return err.textContent = "Please upload your payment screenshot OR fill in the sender phone number, amount and transaction code.";
    if (!phoneOk) return err.textContent = "Wrong number. Sender's phone number must have at least 9 digits.";
    if (!amtOk) return err.textContent = "Please enter the amount (NPR) you paid.";
    return err.textContent = "Please enter the transaction code.";
  }
  if (shotFile && shotFile.size > 10*1024*1024) return err.textContent = "File is too large. Maximum size is 10 MB.";
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Sending...";
  try {
    const url = shotFile ? await uploadShot(shotFile) : "";
    const ref = await addDoc(collection(db,"orders"), {
      uid: me.uid, userName: profile.name, email: me.email,
      game: g.name, item: it.name, price: total, itemPrice: it.price, serviceCharge: SERVICE_CHARGE, gameId,
      screenshot: url, senderPhone: detailsOk ? sphone : "", senderAmount: detailsOk ? samt : "", txnCode: detailsOk ? stxn : "", status: "pending", createdAt: serverTimestamp()
    });
    notifyOwner(ref.id);
    modal("✅","Payment successful","Your payment is successful. Please wait a few minutes while we check the payment. You can track the status in 🔔.","Go to Home",()=>go("home"));
  } catch(e){
    console.error(e);
    err.textContent = "Order failed: " + (e.message || e) + ". Please try again.";
    btn.disabled = false; btn.textContent = "💾 Save and place order";
  }
}

    }).join("") : `<div class="card muted" style="text-align:center">No orders yet.</div>`);
  $("#bk").onclick = () => go("home");
}

/* ---------- Chat (customer) ---------- */
async function markUserRead(){ try{ await setDoc(doc(db,"chats",me.uid), { unreadUser:false }, { merge:true }); }catch(e){} }

function bubblesHTML(msgs, mine){
  if (!msgs.length) return `<div class="muted" style="margin:auto;text-align:center;padding:10px">${mine==="user"?"Ask anything about top-up, payment or your order.<br>We will reply here.":"No messages yet."}</div>`;
  return msgs.map(m => `<div class="bub ${m.from===mine?"me":"them"}">${esc(m.text)}<small>${fmtTime(m)}</small></div>`).join("");
}
function paintMessages(msgs, mine){
  const box = document.getElementById("cbox"); if (!box) return;
  box.innerHTML = bubblesHTML(msgs, mine);
  box.scrollTop = box.scrollHeight;
}

function renderChat(){
  app$.innerHTML = `
    <div class="page-title"><button class="back" id="bk">←</button>💬 Ask us</div>
    <div class="muted" style="margin:-4px 0 8px">We reply during store hours (9am-9pm).</div>
    <div class="chatbox" id="cbox"></div>
    <form class="chatform" id="cform"><input class="inp" id="cin" maxlength="500" placeholder="Type your message..." autocomplete="off"><button class="send" type="submit">➤</button></form>`;
  $("#bk").onclick = () => go("home");
  paintMessages([], "user");
  msgUnsub = onSnapshot(collection(db,"chats",me.uid,"messages"), snap => {
    const msgs = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>ts(a)-ts(b));
    paintMessages(msgs, "user");
  }, err => console.warn(err));
  if (unreadUser) markUserRead();
  $("#cform").onsubmit = async e => {
    e.preventDefault();
    const t = $("#cin").value.trim(); if (!t) return;
    $("#cin").value = "";
    try {
      const mref = await addDoc(collection(db,"chats",me.uid,"messages"), { from:"user", text:t, createdAt: serverTimestamp() });
      await setDoc(doc(db,"chats",me.uid), { uid:me.uid, userName:profile.name, email:me.email, lastMessage:t, lastFrom:"user", lastAt: serverTimestamp(), unreadAdmin:true, unreadUser:false }, { merge:true });
      notifyChat(mref.id);
    } catch(err){ toast("Message not sent: " + err.message); }
  };
}

/* ---------- Admin ---------- */
let adminFilter = "pending", adminView = "orders";
function proofThumb(o){
  if (!o.screenshot) return `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--bg)">🧾</div>`;
  const inner = /\.pdf($|\?)/i.test(o.screenshot) ? `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--bg)">📄</div>` : `<img class="thumb" src="${esc(o.screenshot)}">`;
  return `<a href="${esc(o.screenshot)}" target="_blank">${inner}</a>`;
}
function renderAdmin(){
  if (!isAdmin()) return go("home");
  const unreadChats = adminChats.filter(c=>c.unreadAdmin).length;
  const top = `<div class="page-title"><button class="back" id="bk">←</button>🛠️ Admin</div>
    <div class="ftabs">
      <button class="ftab ${adminView==="orders"?"on":""}" data-v="orders">Orders</button>
      <button class="ftab ${adminView==="chats"?"on":""}" data-v="chats">Chats${unreadChats?" ("+unreadChats+")":""}</button>
    </div>`;
  if (adminView === "chats") {
    app$.innerHTML = top + (adminChats.length ? adminChats.map(c=>`
      <button class="crow" data-cid="${esc(c.id)}">
        <div class="av">${esc((c.userName||"?")[0].toUpperCase())}</div>
        <div class="tx"><b>${esc(c.userName||"Customer")}</b><div class="muted">${c.lastFrom==="admin"?"You: ":""}${esc(c.lastMessage||"")}</div></div>
        ${c.unreadAdmin?`<span class="dotred"></span>`:""}
      </button>`).join("") : `<div class="card muted" style="text-align:center">No chats yet.</div>`);
    app$.querySelectorAll("[data-cid]").forEach(x => x.onclick = () => { const c = adminChats.find(k=>k.id===x.dataset.cid); go("adminchat",{cuid:x.dataset.cid,cname:c?c.userName:"Customer"}); });
  } else {
    const cnt = st => adminOrders.filter(o=>o.status===st).length;
    const list = adminFilter==="all" ? adminOrders : adminOrders.filter(o=>o.status===adminFilter);
    const tab = (k,l) => `<button class="ftab ${adminFilter===k?"on":""}" data-f="${k}">${l}</button>`;
    const btn = (st,id) => st==="approved" ? `<button class="btn" data-st="approved" data-id="${id}">✅ Approve</button>`
      : st==="rejected" ? `<button class="btn red" data-st="rejected" data-id="${id}">❌ Reject</button>`
      : `<button class="btn alt" data-st="pending" data-id="${id}">↩️ Set to Pending</button>`;
    app$.innerHTML = top + `<div class="ftabs">${tab("pending","Pending ("+cnt("pending")+")")}${tab("approved","Approved ("+cnt("approved")+")")}${tab("rejected","Rejected ("+cnt("rejected")+")")}${tab("all","All")}</div>` +
      (list.length ? list.map(o=>`
        <div class="card">
          <div style="display:flex;gap:12px">
            ${proofThumb(o)}
            <div style="flex:1;min-width:0">
              <b>${esc(o.game)} — ${esc(o.item)}</b>
              <div style="font-size:18px;font-weight:800;color:var(--blue2)">${rs(o.price)}</div>
              <div>ID: <b style="user-select:all">${esc(o.gameId)}</b></div>
              ${o.senderPhone?`<div class="muted">Sender: <b style="user-select:all">${esc(o.senderPhone)}</b> • NPR ${esc(o.senderAmount)} • Txn: <b style="user-select:all">${esc(o.txnCode)}</b></div>`:""}
              <div class="muted">${esc(o.userName)} • ${esc(o.email)}</div>
              <div class="muted">${fmtDate(o)}</div>
              <span class="chip ${o.status}">${o.status}</span>
            </div>
          </div>
          <div class="row2">${["approved","rejected","pending"].filter(st=>st!==o.status).map(st=>btn(st,o.id)).join("")}</div>
        </div>`).join("") : `<div class="card muted" style="text-align:center">No orders here.</div>`);
    app$.querySelectorAll("[data-f]").forEach(x => x.onclick = () => { adminFilter = x.dataset.f; renderAdmin(); });
    app$.querySelectorAll("[data-st]").forEach(x => x.onclick = () => setStatus(x.dataset.id, x.dataset.st));
  }
  $("#bk").onclick = () => go("settings");
  app$.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { adminView = x.dataset.v; renderAdmin(); });
}
async function setStatus(id, status){
  const name = status==="approved" ? "APPROVED" : status==="rejected" ? "REJECTED" : "PENDING";
  if (!confirm("Change this order to " + name + "?")) return;
  try { await updateDoc(doc(db,"orders",id), { status, updatedAtMs: Date.now() }); toast("Order is now " + name.toLowerCase()); }
  catch(e){ toast("Error: " + e.message); }
}

function renderAdminChat(){
  if (!isAdmin()) return go("home");
  const cuid = current.cuid;
  app$.innerHTML = `
    <div class="page-title"><button class="back" id="bk">←</button>💬 ${esc(current.cname||"Customer")}</div>
    <div class="chatbox" id="cbox"></div>
    <form class="chatform" id="cform"><input class="inp" id="cin" maxlength="500" placeholder="Type your reply..." autocomplete="off"><button class="send" type="submit">➤</button></form>`;
  $("#bk").onclick = () => { adminView = "chats"; go("admin"); };
  paintMessages([], "admin");
  msgUnsub = onSnapshot(collection(db,"chats",cuid,"messages"), snap => {
    const msgs = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>ts(a)-ts(b));
    paintMessages(msgs, "admin");
  }, err => console.warn(err));
  setDoc(doc(db,"chats",cuid), { unreadAdmin:false }, { merge:true }).catch(()=>{});
  $("#cform").onsubmit = async e => {
    e.preventDefault();
    const t = $("#cin").value.trim(); if (!t) return;
    $("#cin").value = "";
    try {
      await addDoc(collection(db,"chats",cuid,"messages"), { from:"admin", text:t, createdAt: serverTimestamp() });
      await setDoc(doc(db,"chats",cuid), { lastMessage:t, lastFrom:"admin", lastAt: serverTimestamp(), unreadUser:true, unreadAdmin:false }, { merge:true });
    } catch(err){ toast("Reply not sent: " + err.message); }
  };
}
